<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<title id="tab-title">This site can't be reached</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%235f6368' stroke-width='1.3'/%3E%3Cellipse cx='8' cy='8' rx='3' ry='6.5' fill='none' stroke='%235f6368' stroke-width='1.1'/%3E%3Cline x1='1.8' y1='6' x2='14.2' y2='6' stroke='%235f6368' stroke-width='1.1'/%3E%3Cline x1='1.8' y1='10' x2='14.2' y2='10' stroke='%235f6368' stroke-width='1.1'/%3E%3C/svg%3E">
<style>
:root{--bg:#fff;--heading:#202124;--text:#5f6368;--icon:#5f6368;--link:#1a73e8;--btn:#1a73e8;--btn-hover:#1765cc;--btn-text:#fff;--details:#f8f9fa;--border:#dadce0;--error:#d93025;--ok:#188038}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--heading:#e8eaed;--text:#9aa0a6;--icon:#9aa0a6;--link:#8ab4f8;--btn:#8ab4f8;--btn-hover:#93bbf9;--btn-text:#202124;--details:#292a2d;--border:#3c4043;--error:#f28b82;--ok:#81c995}}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{font-size:1em;margin:14vh auto 0;max-width:600px;padding:0 24px;width:100%;transition:opacity .2s ease}
main.reloading{opacity:.34;pointer-events:none}
.icon-wrapper{margin-bottom:36px}
.icon-generic{width:72px;height:72px;display:block;shape-rendering:crispEdges}
h1{color:var(--heading);font-size:1.6em;font-weight:500;line-height:1.25;margin:0 0 16px;overflow-wrap:anywhere}
.main-message{margin:0 0 16px}.domain-name{font-weight:700}
.suggestions-label{margin:0 0 4px}
ul.suggestions-list{margin:0 0 32px;padding-left:36px;list-style-type:disc}
ul.suggestions-list li{margin-bottom:2px}
a.diag-link{color:var(--link);text-decoration:none;cursor:pointer}
a.diag-link:hover{text-decoration:underline}
.nav-wrapper{margin-bottom:28px;display:flex;gap:12px}
.reload-button{background:var(--btn);color:var(--btn-text);border:0;border-radius:20px;cursor:pointer;font:500 14px/20px inherit;padding:8px 22px;min-height:36px;transition:background .15s}
.reload-button:hover{background:var(--btn-hover)}
.reload-button:disabled{opacity:.65;cursor:default}
.error-code{font-size:12px;letter-spacing:.25px;text-transform:uppercase;margin-top:8px}
.reload-progress{position:fixed;top:0;left:0;width:0;height:3px;background:var(--link);opacity:0;z-index:100;transition:width .65s ease-out,opacity .2s}
.reload-progress.loading{width:85%;opacity:1}
.diagnostic-panel{display:none;margin-top:24px;padding:16px 20px;background:var(--details);border:1px solid var(--border);border-radius:8px;font-size:13px;line-height:1.55}
.diagnostic-panel.active{display:block}
.diagnostic-panel strong{color:var(--heading);display:block;margin-bottom:6px}
.passcode-panel{display:none;margin:-18px 0 24px;padding:14px 16px;background:var(--details);border:1px solid var(--border);border-radius:10px;animation:fadeSlide .18s ease}
.passcode-panel.active{display:block}
.passcode-form{display:flex;gap:8px;align-items:center}
.passcode-input{flex:1;min-width:0;padding:9px 12px;font:14px inherit;color:var(--heading);background:var(--bg);border:1px solid var(--border);border-radius:8px;outline:none}
.passcode-input:focus{border-color:var(--link)}
.passcode-submit{background:var(--btn);color:var(--btn-text);border:0;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:500;cursor:pointer}
.passcode-submit:disabled{opacity:.65}
.passcode-feedback{display:none;font-size:13px;margin-top:8px}
.passcode-feedback.error{display:block;color:var(--error)}
.passcode-feedback.success{display:block;color:var(--ok)}
.passcode-panel.shake{animation:shake .3s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-4px)}}
@media(max-width:640px){main{margin-top:8vh;padding:0 20px}h1{font-size:1.45em}.reload-button{width:100%;padding:10px 20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Simulated network error screen for a privately owned site, not a browser-originated error -->
<div class="reload-progress" id="reload-progress" aria-hidden="true"></div>
<main id="main-wrapper" role="main">
 <div class="icon-wrapper">
  <svg class="icon-generic" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="var(--icon)" d="M6 4h16v2H8v24h20V14h2v18H6V4zm16 0h2v8h8v2H22V4zm2 2h2v2h-2V6zm2 2h2v2h-2V8zm2 2h2v2h-2v-2z"/>
    <rect x="12" y="14" width="2" height="2" fill="var(--icon)"/>
    <rect x="20" y="14" width="2" height="2" fill="var(--icon)"/>
    <path fill="var(--icon)" d="M13 22h8v2h-8v-2zm-2 2h2v2h-2v-2zm10 0h2v2h-2v-2z"/>
  </svg>
 </div>
 <h1>This site can’t be reached</h1>
 <p class="main-message"><span class="domain-name" id="domain-display">example.com</span> took too long to respond.</p>
 <p class="suggestions-label">Try:</p>
 <ul class="suggestions-list">
  <li>Checking the connection</li>
  <li>Checking the <a class="diag-link" role="button" tabindex="0" data-topic="proxy">proxy</a> and the <a class="diag-link" role="button" tabindex="0" data-topic="firewall">firewall</a></li>
  <li><a class="diag-link" role="button" tabindex="0" data-topic="diagnostics">Running Windows Network Diagnostics</a></li>
  <li><a class="diag-link" role="button" tabindex="0" id="more-link">More</a></li>
 </ul>
 <div class="passcode-panel" id="passcode-panel" dir="ltr" aria-hidden="true">
  <form class="passcode-form" id="passcode-form" autocomplete="off">
   <input type="password" id="passcode-input" class="passcode-input" placeholder="Enter code..." aria-label="Enter code" required>
   <button type="submit" class="passcode-submit" id="passcode-submit">Continue</button>
  </form>
  <div class="passcode-feedback" id="passcode-feedback" aria-live="polite"></div>
 </div>
 <div class="nav-wrapper"><button type="button" class="reload-button" id="reload-btn">Reload</button></div>
 <div class="error-code" id="error-code">ERR_CONNECTION_TIMED_OUT</div>
 <div class="diagnostic-panel" id="diagnostic-panel" aria-live="polite"></div>
</main>
<script>
(function(){
 const CODE_SALT="aa0f323a978c9b6025a7dbf804a456b7";
 const CODE_HASH="1c951bfd7a6eb95a5452bf63816abb9663aa689cbf9ec4e5b407236250a5b956";
 const ENTRY_PATH="./vault/";
 const SESSION_KEY="aiham-rk-entry-v1";
 const $=id=>document.getElementById(id);
 $("domain-display").textContent=location.hostname||"example.com";
 $("tab-title").textContent=location.hostname||"This site can't be reached";
 const reloadBtn=$("reload-btn"),wrapper=$("main-wrapper"),progress=$("reload-progress");
 const diag=$("diagnostic-panel"),panel=$("passcode-panel"),input=$("passcode-input"),form=$("passcode-form"),feedback=$("passcode-feedback"),submit=$("passcode-submit");
 let activeTopic=null;
 const topics={
  proxy:{title:"Check your proxy settings",body:"Check the proxy configuration for your current connection."},
  firewall:{title:"Allow your browser to access the network",body:"Check the firewall settings and network permissions."},
  diagnostics:{title:"Network diagnostics",body:"Use your device's connection settings to diagnose network problems."}
 };
 const resetFeedback=()=>{feedback.className="passcode-feedback";feedback.textContent=""};
 function closePanel(){panel.classList.remove("active");panel.setAttribute("aria-hidden","true");input.value="";input.disabled=false;submit.disabled=false;resetFeedback()}
 function closeDiagnostics(){diag.classList.remove("active");activeTopic=null}
 reloadBtn.addEventListener("click",()=>{
  reloadBtn.disabled=true;closePanel();closeDiagnostics();progress.classList.add("loading");wrapper.classList.add("reloading");
  setTimeout(()=>{progress.classList.remove("loading");wrapper.classList.remove("reloading");reloadBtn.disabled=false},700);
 });
 function togglePanel(e){e.preventDefault();const opening=!panel.classList.contains("active");closeDiagnostics();closePanel();if(opening){panel.classList.add("active");panel.setAttribute("aria-hidden","false");input.focus()}}
 $("more-link").addEventListener("click",togglePanel);
 $("more-link").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){togglePanel(e)}});
 document.querySelectorAll(".diag-link[data-topic]").forEach(a=>{
  a.addEventListener("click",e=>{
   e.preventDefault();closePanel();
   const topic=a.dataset.topic;
   if(activeTopic===topic && diag.classList.contains("active")){closeDiagnostics();return}
   const item=topics[topic];if(!item)return;
   diag.innerHTML="<strong>"+item.title+"</strong>"+item.body;diag.classList.add("active");activeTopic=topic;
  });
 });
 input.addEventListener("input",resetFeedback);
 form.addEventListener("submit",async e=>{
  e.preventDefault();submit.disabled=true;
  const norm=input.value.trim().toUpperCase().replace(/[\s-]/g,"");
  try{
   if(!/^[A-HJ-NP-Z2-9]{20}$/.test(norm))throw Error("invalid");
   const bytes=new TextEncoder().encode(CODE_SALT+":"+norm);
   const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))).map(b=>b.toString(16).padStart(2,"0")).join("");
   if(hash!==CODE_HASH)throw Error("invalid");
   sessionStorage.setItem(SESSION_KEY,String(Date.now()));
   window.location.assign(ENTRY_PATH);
  }catch(err){
   feedback.textContent="Incorrect code. Please try again.";
   feedback.className="passcode-feedback error";
   panel.classList.remove("shake");void panel.offsetWidth;panel.classList.add("shake");
   input.select();submit.disabled=false;
  }
 });
})();
</script>
</body>
</html>
